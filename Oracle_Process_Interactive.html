<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Oracle NetSuite · ผังกระบวนการ + คำอธิบาย (Interactive)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--font-dm-sans:'DM Sans';--font-noto-thai:'Noto Sans Thai';--font-sans:var(--font-dm-sans),var(--font-noto-thai),Tahoma,sans-serif;--bg:#f5f5f7;--line:rgba(0,0,0,.09);--navy:#1d1d1f;--ink:#1d1d1f;--muted:#6e6e73;--ink3:#a1a1a6;--green:#1d4ed8;--gink:#1e40af;--blue:#0071e3;--bink:#0066cc;--red:#ff3b30;--ease:cubic-bezier(.25,.1,.25,1);--glass:saturate(180%) blur(20px);--sh-sm:0 1px 3px rgba(0,0,0,.06);--sh-md:0 6px 20px rgba(0,0,0,.10);--sh-lg:0 12px 40px rgba(0,0,0,.14);--sh-card:0 1px 2px rgba(16,24,40,.04),0 4px 10px rgba(16,24,40,.05),0 10px 22px rgba(16,24,40,.06);--sh-card-h:0 2px 4px rgba(16,24,40,.05),0 8px 18px rgba(16,24,40,.09),0 20px 44px rgba(16,24,40,.11);--topH:52px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:var(--font-sans);background:var(--bg);color:var(--ink)}
#top{position:fixed;top:0;left:0;right:0;min-height:52px;background:rgba(255,255,255,.72);-webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass);border-bottom:1px solid var(--line);z-index:30;display:flex;align-items:center;gap:10px;padding:6px 14px;flex-wrap:wrap}
.ti{font-size:15px;font-weight:800;color:var(--navy);letter-spacing:-.02em} .ti b{color:var(--green)}
.ctrl{display:flex;gap:4px;align-items:center}
.ic{width:15px;height:15px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px}
.ctrl button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--navy);border:1px solid var(--line);border-radius:980px;padding:5px 11px;background:rgba(0,0,0,.03);transition:background .2s var(--ease),transform .2s var(--ease)}
.ctrl button:hover{background:rgba(0,0,0,.07)} .ctrl button:active{transform:scale(.96)} .ctrl button.on{background:var(--green);color:#fff;border-color:var(--green)}
#zpct{font-size:11px;color:var(--muted);min-width:38px;text-align:center}
.searchwrap{margin-left:auto;position:relative}
#searchicon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink3);pointer-events:none}
#search{width:230px;padding:7px 52px 7px 33px;border:1px solid var(--line);border-radius:980px;font-family:inherit;font-size:13px;background:rgba(0,0,0,.04);outline:none;transition:box-shadow .2s var(--ease),background .2s var(--ease)}
#search:focus{background:#fff;box-shadow:0 0 0 4px rgba(0,113,227,.18)}
#scount{position:absolute;right:10px;top:7px;font-size:11px;color:var(--ink3)}
#legend{display:flex;gap:7px;flex-wrap:wrap;font-size:10.5px;color:var(--muted)}
#legend .lg{display:inline-flex;align-items:center;gap:4px;font-weight:500;cursor:pointer;padding:2px 6px;border-radius:6px;border:1px solid transparent}
#legend .lg:hover{background:var(--bg)} #legend .lg.on{border-color:currentColor}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}
#stage{position:fixed;top:var(--topH,52px);left:0;right:0;bottom:0;overflow:auto;cursor:grab}
#stage.grabbing{cursor:grabbing}
#wrap{position:relative;transform-origin:0 0}
#canvas{position:relative}
.laneband{position:absolute;top:44px;border-right:1px solid #e6e9ee;background:#f8fafc;z-index:0}
#laneheadbar{position:fixed;top:var(--topH,52px);left:0;right:0;height:44px;overflow:hidden;z-index:25;background:rgba(245,245,247,.6);-webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass)}
#laneheadInner{position:absolute;top:0;left:0;transform-origin:0 0;height:44px}
.lanehead{position:absolute;top:0;height:44px;border-right:1px solid var(--line);display:flex;align-items:center;justify-content:center;text-align:center;font-size:13px;font-weight:800;color:#fff;padding:0 6px;cursor:pointer;user-select:none}
.lanehead.on{outline:3px solid rgba(0,0,0,.25);outline-offset:-3px}
svg#wires{position:absolute;top:0;left:0;pointer-events:none;z-index:2}
.box{position:absolute;background:#fff;border:1px solid rgba(16,24,40,.05);border-left:3px solid var(--line)  border-radius:16px;padding:8px 12px;font-size:14px;font-weight:600;color:var(--navy);cursor:pointer;z-index:3;overflow:hidden;box-shadow:var(--sh-card);display:flex;align-items:center;transition:box-shadow .3s var(--ease),transform .3s var(--ease)}
.box:hover{box-shadow:var(--sh-card-h);transform:translateY(-3px)}
.box:focus-visible{outline:3px solid var(--blue);outline-offset:1px}
.box.sel{background:#e4f5ec;box-shadow:0 0 0 3px rgba(29,78,216,.45);transform:translateY(-1px);border-color:var(--green);z-index:6}
.box.prevhi{background:#eef8f3;box-shadow:0 0 0 3px rgba(29,78,216,.45);z-index:5}
.box.nexthi{background:#eaf1fc;box-shadow:0 0 0 3px rgba(0,113,227,.45);z-index:5}
.box.match{outline:2px solid #f0a500;outline-offset:1px}
.box.dim{opacity:.14;pointer-events:none}
.box.gw{background:#fff8e1;border-color:#f9a825;border-left-color:#f9a825;text-align:center;font-size:16px;font-weight:800;display:flex;align-items:center;justify-content:center}
.box .bl{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.25;width:100%;padding-right:11px}
.box .cat{position:absolute;right:5px;top:5px;width:7px;height:7px;border-radius:50%}
.box .pdot{position:absolute;left:6px;bottom:5px;width:8px;height:8px;border-radius:2px;box-shadow:0 0 0 1.5px #fff}
.box.inzone{z-index:4}
#phasebar{gap:5px}.plabel{font-size:11px;font-weight:700;color:var(--muted)}
.pchip{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;color:var(--navy);border:1px solid var(--line);border-radius:980px;padding:4px 10px;background:rgba(0,0,0,.03);transition:all .2s var(--ease)}
.pchip:hover{background:rgba(0,0,0,.07)}.pchip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.pdc{width:9px;height:9px;border-radius:2px;box-shadow:0 0 0 1px rgba(255,255,255,.6)}
#panel{position:fixed;top:0;right:0;width:360px;height:100vh;background:rgba(255,255,255,.82);-webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass);border-left:1px solid var(--line);overflow-y:auto;z-index:40;padding:20px 20px 44px}
#pclose{display:none}
#panel .empty{color:var(--ink3);font-size:16px;margin-top:40px;text-align:center;line-height:1.7}
#panel .empty .ic{width:26px;height:26px;stroke-width:1.5;display:block;margin:0 auto 12px;color:var(--ink3)}
#panel h2{font-size:22px;font-weight:800;color:var(--navy);line-height:1.22;letter-spacing:-.02em;margin-bottom:7px}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.badge{font-size:13px;font-weight:700;padding:3px 10px;border-radius:100px}
.sec{margin-bottom:12px}
.sec .l{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--gink);margin-bottom:3px}
.sec .l .ic{width:13px;height:13px}
.sec .v{font-size:16px;color:var(--ink);line-height:1.5}
.sec.warn .v{color:var(--red);background:#fbeaea;border-radius:12px;padding:9px 12px}
.sec.sap .v{color:var(--bink);background:rgba(0,113,227,.08);border-radius:12px;padding:8px 11px;font-size:15px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:14px;border-radius:980px;padding:6px 12px;cursor:pointer;border:1px solid var(--line);background:rgba(0,0,0,.03);color:var(--navy);transition:background .2s var(--ease),transform .15s var(--ease)}
.chip:hover{background:rgba(0,0,0,.07)} .chip:active{transform:scale(.96)}
.chip.p{border-color:#c3d4f7;background:#eff4ff;color:var(--gink)} .chip.n{border-color:#bcd6f5;background:#e9f1fc;color:var(--bink)}
#tip{position:fixed;pointer-events:none;background:rgba(30,30,32,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#fff;font-size:12px;padding:7px 11px;border-radius:10px;max-width:250px;line-height:1.4;z-index:60;opacity:0;transition:opacity .15s var(--ease);box-shadow:var(--sh-md)}
#tip.on{opacity:1}
#mini{position:fixed;right:12px;bottom:12px;width:180px;background:rgba(255,255,255,.82);-webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh-md);z-index:28;overflow:hidden;cursor:pointer}
#mini svg{display:block}
#mini .vp{fill:rgba(0,113,227,.18);stroke:var(--blue);stroke-width:2}
.hint{position:fixed;bottom:8px;left:12px;font-size:11px;color:var(--ink3);z-index:35}
body.present .hint{display:none}
@media (prefers-reduced-motion:reduce){.box{transition:none} html{scroll-behavior:auto}}
@media (max-width:860px){
 #top,#stage,#laneheadbar{right:0}
 #panel{width:100%;height:62vh;top:auto;bottom:0;border-left:none;border-top:2px solid var(--line);transform:translateY(100%);transition:transform .25s}
 #panel.open{transform:translateY(0)}
 #pclose{display:block;position:absolute;right:14px;top:12px;font-size:22px;cursor:pointer;color:var(--muted)}
 #mini{display:none} .searchwrap{margin-left:0}
}

#pop{position:fixed;z-index:55;width:300px;max-height:64vh;overflow:auto;background:rgba(255,255,255,.92);-webkit-backdrop-filter:saturate(180%) blur(16px);backdrop-filter:saturate(180%) blur(16px);border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 44px rgba(0,0,0,.20);padding:13px 14px;opacity:0;transform:scale(.97);pointer-events:none;transition:opacity .14s var(--ease),transform .14s var(--ease)}
#pop.on{opacity:1;transform:none;pointer-events:auto}
.pophd{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:7px}
.pophd b{font-size:15px;font-weight:800;color:var(--navy);line-height:1.25;letter-spacing:-.01em}
.popx{cursor:pointer;color:var(--muted);font-size:18px;line-height:1;flex:none}
.popbadges{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:9px}
.pb{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:100px}
.pops{font-size:13px;line-height:1.5;margin-bottom:7px;color:var(--ink)}
.popl{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--gink);margin-right:5px}
.pops.sap{color:var(--bink);background:rgba(0,113,227,.08);border-radius:8px;padding:6px 9px;font-size:12px}
.pops.sap .popl{color:var(--bink)}
.popflow{margin-bottom:9px}
.popflow .popl{display:block;margin-bottom:5px}
.popcol{display:flex;flex-direction:column;gap:5px;align-items:flex-start}
.popcol .chip{cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:11px;padding:3px 10px;font-weight:600}
.popcol .chip::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;opacity:1;flex:none}
.popfull{all:unset;cursor:pointer;display:block;text-align:center;margin-top:9px;font-size:12px;font-weight:700;color:var(--blue);background:rgba(0,113,227,.10);border-radius:9px;padding:8px}
.popfull:hover{background:rgba(0,113,227,.18)}
#panel.flash{animation:panelflash .7s var(--ease)}
@keyframes panelflash{0%,100%{box-shadow:none}30%{box-shadow:-6px 0 0 0 rgba(0,113,227,.5) inset}}
#panel{display:none!important}
.pops.warn{color:var(--red);background:#fdeceb;border-radius:8px;padding:6px 9px}
#pop{width:320px}
</style></head>
<body>
<div id="top">
 <div class="ti"><b>Oracle</b> · ผัง+คำอธิบาย</div>
 <div class="ctrl"><button onclick="zfit()"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>ฟิตจอ</button><button onclick="zadd(-1)" aria-label="ซูมออก"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/><path d="M8 11h6"/></svg></button><span id="zpct">100%</span><button onclick="zadd(1)" aria-label="ซูมเข้า"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/><path d="M11 8v6"/><path d="M8 11h6"/></svg></button><button onclick="toggleFull()" id="fsBtn" aria-label="ขยายเต็มจอแบบพรีเซนต์"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/></svg><span id="fsLbl">เต็มจอ</span></button></div>
 <div class="ctrl phasebar" id="phasebar"><span class="plabel">โซน LV0:</span></div><div class="ctrl"><button id="edgeBtn" onclick="toggleEdges()" class="on"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="19" r="3"/><path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"/><circle cx="18" cy="5" r="3"/></svg><span id="edgeLbl">เส้น: ทั้งหมด</span></button><button onclick="clearFilters()"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M13.013 3H2l8 9.46V19l4 2v-8.54l.9-1.055"/><path d="m22 3-5 5"/><path d="m17 3 5 5"/></svg>ล้างตัวกรอง</button></div>
 <div id="legend"></div>
 <div class="searchwrap"><span id="searchicon"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></span><input id="search" placeholder="ค้นหางาน... ( / )" autocomplete="off"><span id="scount"></span></div>
</div>
<div id="laneheadbar"><div id="laneheadInner"></div></div>
<div id="stage"><div id="wrap"><div id="canvas"><svg id="wires"><defs>
<marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#aab4c0"/></marker>
<marker id="arGr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#1d4ed8"/></marker>
<marker id="arBl" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#0071e3"/></marker>
<marker id="arHv" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#7a8698"/></marker>
</defs><g id="zone"></g><g id="base"></g><g id="hov"></g><g id="hi"></g></svg></div></div></div>
<div id="mini"></div>
<div id="panel"><span id="pclose" onclick="closePanel()">×</span><div class="empty"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4.1 12 6"/><path d="m5.1 8-2.9-.8"/><path d="m6 12-1.9 2"/><path d="M7.2 2.2 8 5.1"/><path d="M9.037 9.69a.498.498 0 0 1 .653-.653l11 4.5a.5.5 0 0 1-.074.949l-4.349 1.041a1 1 0 0 0-.74.739l-1.04 4.35a.5.5 0 0 1-.95.074z"/></svg>คลิกกล่องใดก็ได้ในผัง<br>เพื่อดู "ทำอะไร · ต้องทำอะไร · เดิมทำยังไง"<br><br>เส้นบางเทา=flow ทั้งหมด · คลิกแล้ว เขียว=รับต่อจาก · น้ำเงิน=ส่งต่อให้<br><br><b>คีย์ลัด:</b> ←→ เดิน flow · Esc ปิด · / ค้นหา</div></div>
<div id="tip"></div>
<div id="pop"></div>
<div class="hint">ลากพื้นที่ว่าง=เลื่อน · ←→=เดิน flow · hover=ดูย่อ</div>

 if(topBox){const t=document.createElementNS(SVGNS,'text');t.setAttribute('x',(topBox[0]+6).toFixed(1));t.setAttribute('y',Math.max(topBox[1]-9,15).toFixed(1));t.setAttribute('fill',col);t.setAttribute('font-weight','800');t.setAttribute('font-size','16');t.setAttribute('paint-order','stroke');t.setAttribute('stroke','#fff');t.setAttribute('stroke-width','4');t.setAttribute('stroke-linejoin','round');t.textContent='LV0-0'+phaseFilter+'  '+PHNAME[phaseFilter];g.appendChild(t);}}
function focusZone(){if(!phaseFilter)return;
 const ph=DATA.nodes.filter(n=>PHASE[n.id]===phaseFilter);if(!ph.length)return;
 const P=ph.map((_,i)=>i);const find=i=>P[i]===i?i:(P[i]=find(P[i]));const uni=(a,b)=>{P[find(a)]=find(b);};
 for(let i=0;i<ph.length;i++)for(let k=i+1;k<ph.length;k++){if(Math.abs(ph[i].lane-ph[k].lane)<=1&&Math.abs(ph[i].rank-ph[k].rank)<=55)uni(i,k);}
 const gr={};ph.forEach((n,i)=>{const r=find(i);(gr[r]=gr[r]||[]).push(n);});
 const groups=Object.values(gr);groups.sort((a,b)=>b.length-a.length||(Math.min.apply(0,a.map(n=>n.rank))-Math.min.apply(0,b.map(n=>n.rank))));
 const gs=groups[0];let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
 gs.forEach(n=>{const x=bx(n),y=by(n);x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x+BW);y1=Math.max(y1,y+BH);});
 const cx=(x0+x1)/2*scale,cy=(y0+y1)/2*scale;
 stage.scrollTo({left:Math.max(0,cx-stage.clientWidth/2),top:Math.max(0,cy-stage.clientHeight/2),behavior:'smooth'});}
function selectPhase(p){phaseFilter=(phaseFilter===p?null:p);
 document.querySelectorAll('.pchip').forEach(x=>x.classList.toggle('on',x.dataset.p&&+x.dataset.p===phaseFilter));
 document.querySelector('.pchip.pall').classList.toggle('on',phaseFilter===null);
 applyFilters();drawZone();focusZone();}
(function buildPhasebar(){const pbar=document.getElementById('phasebar');if(!pbar)return;
 [1,2,3,4,5].forEach(p=>{const b=document.createElement('button');b.className='pchip';b.dataset.p=p;b.title=PHNAME[p];
  b.innerHTML='<span class="pdc" style="background:'+PHC[p]+'"></span>LV0-0'+p+' '+PHNAME[p];b.onclick=()=>selectPhase(p);pbar.appendChild(b);});
 const all=document.createElement('button');all.className='pchip pall on';all.textContent='ทั้งหมด';all.onclick=()=>selectPhase(null);pbar.appendChild(all);})();
function clearG(g){while(g.firstChild)g.removeChild(g.firstChild);}
function pathd(A,B){const x1=cxc(A),y1=by(A)+BH,x2=cxc(B),y2=by(B),my=(y1+y2)/2;
 if(Math.abs(x1-x2)<1)return `M${x1} ${y1} L${x2} ${y2}`;
 return `M${x1} ${y1} L${x1} ${my} L${x2} ${my} L${x2} ${y2}`;}
function edge(g,a,b,stroke,w,op,mk){const p=document.createElementNS('http://www.w3.org/2000/svg','path');
 p.setAttribute('d',pathd(N[a],N[b]));p.setAttribute('fill','none');p.setAttribute('stroke',stroke);p.setAttribute('stroke-width',w);p.setAttribute('opacity',op);if(mk)p.setAttribute('marker-end','url(#'+mk+')');g.appendChild(p);}
// base edges (all, faint)
DATA.nodes.forEach(n=>(n.next||[]).forEach(t=>edge(base,n.id,t,'#c2ccd8','1','.55','arG')));
// state
let cur=null,laneFilter=null,catFilter=null,searchTerm='',edgeMode='all',scale=1,phaseFilter=null;
function drawHover(id){clearG(hov);if(cur===id)return;const n=N[id];
 (n.prev||[]).forEach(p=>edge(hov,p,id,'#7a8698','2','.75','arHv'));
 (n.next||[]).forEach(x=>edge(hov,id,x,'#7a8698','2','.75','arHv'));}
function select(id,push){cur=id;const n=N[id];clearG(hov);
 canvas.querySelectorAll('.box').forEach(b=>b.classList.remove('sel','prevhi','nexthi'));
 clearG(hi);
 const el=boxEl(id);el.classList.add('sel');
 (n.prev||[]).forEach(p=>{const e=boxEl(p);if(e)e.classList.add('prevhi');edge(hi,p,id,'#1d4ed8','2.6','.95','arGr');});
 (n.next||[]).forEach(x=>{const e=boxEl(x);if(e)e.classList.add('nexthi');edge(hi,id,x,'#0071e3','2.6','.95','arBl');});
 if(push!==false && location.hash!=='#'+id) history.replaceState(null,'','#'+id);
 try{const sr=stage.getBoundingClientRect(),br=el.getBoundingClientRect();if(br.top<sr.top+46||br.bottom>sr.bottom-8||br.left<sr.left+8||br.right>sr.right-8)el.scrollIntoView({block:'center',inline:'center'});}catch(e){}
 renderPop(n);positionPop(id);}
function chip(id,cls){const l=(N[id]&&N[id].label)||id;return '<span class="chip '+cls+'" data-go="'+id+'">'+l+'</span>';}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function renderPanel(n){const lane=DATA.lanes[n.lane],lc='#'+DATA.lanec[n.lane],cc=CATC[n.typ]||'#9aa2af',isW=/SLA|\*|ห้าม/.test(n.caution||'');
 let h='<span id="pclose" onclick="closePanel()">×</span><h2>'+esc(n.label)+'</h2><div class="badges"><span class="badge" style="background:'+lc+'22;color:'+lc+'">'+lane+'</span><span class="badge" style="background:'+cc+'22;color:'+cc+'">'+n.typ+'</span><span class="badge" style="background:#eef1f4;color:#556">'+n.system+'</span></div>';
 function s(l,v,cls){return v&&v!=='—'?'<div class="sec '+(cls||'')+'"><div class="l">'+l+'</div><div class="v">'+esc(v)+'</div></div>':'';}
 h+=s('อธิบายง่ายๆ',n.plain)+s('ตัวอย่าง',n.ex)+s('คุณต้องทำ / กรอกอะไร',n.act)+s('เอกสาร/แบบฟอร์ม',n.doc)+s('เมื่อไหร่',n.when)+s('ข้อควรระวัง / SLA',n.caution,isW?'warn':'')+s('เดิมทำยังไง',n.old)+s('อ้างอิง SAP (t-code)',n.sap,'sap');
 if((n.prev||[]).length)h+='<div class="sec"><div class="l"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>รับต่อจาก</div><div class="chips">'+n.prev.map(p=>chip(p,'p')).join('')+'</div></div>';
 if((n.next||[]).length)h+='<div class="sec"><div class="l"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>ส่งต่อให้</div><div class="chips">'+n.next.map(x=>chip(x,'n')).join('')+'</div></div>';
 const P=document.getElementById('panel');P.innerHTML=h;P.querySelectorAll('[data-go]').forEach(c=>c.onclick=()=>select(c.dataset.go));}
function closePanel(){document.getElementById('panel').classList.remove('open');deselect();}
function deselect(){cur=null;canvas.querySelectorAll('.box').forEach(b=>b.classList.remove('sel','prevhi','nexthi'));clearG(hi);hidePop();}
stage.addEventListener('click',deselect);
// tooltip
const tip=document.getElementById('tip');
function showTip(n,e){tip.textContent=n.plain||n.label;tip.classList.add('on');moveTip(e);}
function moveTip(e){let x=e.clientX+14,y=e.clientY+16;if(x+260>innerWidth)x=e.clientX-260;tip.style.left=x+'px';tip.style.top=y+'px';}
function hideTip(){tip.classList.remove('on');}
// legend (clickable category filter)
const lg=document.getElementById('legend');
lg.innerHTML=Object.entries(CATC).map(([k,v])=>'<span class="lg" data-cat="'+k+'" style="color:'+v+'"><span class="dot" style="background:'+v+'"></span>'+k+'</span>').join('');
lg.querySelectorAll('.lg').forEach(el=>el.onclick=()=>{const c=el.dataset.cat;catFilter=(catFilter===c?null:c);lg.querySelectorAll('.lg').forEach(x=>x.classList.toggle('on',x.dataset.cat===catFilter));applyFilters();});
// search + filters
const sc=document.getElementById('scount');
function applyFilters(){const q=searchTerm.toLowerCase();let cnt=0;
 DATA.nodes.forEach(n=>{const el=boxEl(n.id);let show=true;
  if(laneFilter!=null&&n.lane!==laneFilter)show=false;
  if(catFilter&&n.typ!==catFilter)show=false;
  if(phaseFilter&&PHASE[n.id]!==phaseFilter)show=false;
  const ms=!q||(n.label+' '+n.plain+' '+n.ex+' '+n.act).toLowerCase().indexOf(q)>=0;
  if(q&&!ms)show=false;
  el.classList.toggle('dim',!show);el.classList.toggle('match',!!q&&ms&&show);
  const _inz=phaseFilter&&PHASE[n.id]===phaseFilter;el.classList.toggle('inzone',!!_inz);if(_inz)el.style.setProperty('--zc',PHC[phaseFilter]);
  if(q&&ms&&show)cnt++;});
 sc.textContent=q?cnt+' ผล':'';}
document.getElementById('search').addEventListener('input',e=>{searchTerm=e.target.value.trim();applyFilters();});
document.getElementById('search').addEventListener('keydown',e=>{if(e.key==='Enter'){const m=[...canvas.querySelectorAll('.box.match')];if(m.length){let i=m.findIndex(x=>x.dataset.id===cur);select(m[(i+1)%m.length].dataset.id);}}});
function clearFilters(){laneFilter=null;catFilter=null;searchTerm='';phaseFilter=null;document.getElementById('search').value='';document.querySelectorAll('.lanehead').forEach(x=>x.classList.remove('on'));lg.querySelectorAll('.lg').forEach(x=>x.classList.remove('on'));document.querySelectorAll('.pchip').forEach(x=>x.classList.remove('on'));applyFilters();drawZone();}
// edge toggle
function toggleEdges(){edgeMode=(edgeMode==='all'?'sel':'all');base.style.display=(edgeMode==='all'?'':'none');const b=document.getElementById('edgeBtn');document.getElementById('edgeLbl').textContent='เส้น: '+(edgeMode==='all'?'ทั้งหมด':'เฉพาะที่เลือก');b.classList.toggle('on',edgeMode==='all');}
// zoom
function applyZoom(){wrap.style.transform='scale('+scale+')';wrap.style.width=(cw*scale)+'px';wrap.style.height=(ch*scale)+'px';document.getElementById('zpct').textContent=Math.round(scale*100)+'%';syncHead();updateMini();if(cur)positionPop(cur);}
function zfit(){scale=Math.max(.18,Math.min(1,(stage.clientWidth-4)/cw));applyZoom();}
function zadd(dir){scale=Math.max(.18,Math.min(1.8,+(scale+dir*0.12).toFixed(2)));applyZoom();}
const IC_EXPAND='<path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/>',IC_SHRINK='<path d="M4 14h6v6"/><path d="M20 10h-6V4"/><path d="M14 10l7-7"/><path d="M3 21l7-7"/>';
function toggleFull(){const el=document.documentElement;const rq=el.requestFullscreen||el.webkitRequestFullscreen;const ex=document.exitFullscreen||document.webkitExitFullscreen;if(!document.fullscreenElement&&!document.webkitFullscreenElement){rq&&rq.call(el);}else{ex&&ex.call(document);}}
function onFsChange(){const on=!!(document.fullscreenElement||document.webkitFullscreenElement);const b=document.getElementById('fsBtn');b.classList.toggle('on',on);document.getElementById('fsLbl').textContent=on?'ออกเต็มจอ':'เต็มจอ';b.querySelector('.ic').innerHTML=on?IC_SHRINK:IC_EXPAND;document.body.classList.toggle('present',on);setTimeout(function(){fitTop();zfit();},140);}
document.addEventListener('fullscreenchange',onFsChange);document.addEventListener('webkitfullscreenchange',onFsChange);
document.addEventListener('keydown',e=>{if(e.key==='F11'){e.preventDefault();toggleFull();}});
function syncHead(){inner.style.transform='translateX('+(-stage.scrollLeft)+'px) scale('+scale+')';document.getElementById('laneheadbar').style.height=(44*scale)+'px';}
function fitTop(){const h=document.getElementById('top').offsetHeight;if(h>0)document.documentElement.style.setProperty('--topH',h+'px');}
window.addEventListener('resize',()=>{fitTop();syncHead();updateMini();});
window.addEventListener('load',fitTop);fitTop();
stage.addEventListener('scroll',()=>{syncHead();updateMini();if(cur)positionPop(cur);});
stage.addEventListener('wheel',e=>{if(e.ctrlKey){e.preventDefault();zadd(e.deltaY<0?1:-1);}},{passive:false});
// minimap
const MW=180;const mscale=MW/cw;const mh=ch*mscale;
const mini=document.getElementById('mini');
let msvg='<svg width="'+MW+'" height="'+mh.toFixed(0)+'">';
DATA.lanes.forEach((nm,i)=>{msvg+='<rect x="'+((PAD+i*COLW)*mscale).toFixed(1)+'" y="0" width="'+(COLW*mscale).toFixed(1)+'" height="'+mh.toFixed(0)+'" fill="'+(i%2?'#f0f3f7':'#f7f9fb')+'"/>';});
DATA.nodes.forEach(n=>{msvg+='<rect x="'+(bx(n)*mscale).toFixed(1)+'" y="'+(by(n)*mscale).toFixed(1)+'" width="'+(BW*mscale).toFixed(1)+'" height="'+(BH*mscale).toFixed(1)+'" rx="1" fill="'+(CATC[n.typ]||'#9aa2af')+'" opacity=".7"/>';});
msvg+='<rect id="vp" class="vp"/></svg>';
mini.innerHTML=msvg;
function updateMini(){const vp=document.getElementById('vp');if(!vp)return;
 const vx=(stage.scrollLeft/scale)*mscale, vy=((stage.scrollTop)/scale)*mscale;
 const vw=(stage.clientWidth/scale)*mscale, vh=(stage.clientHeight/scale)*mscale;
 vp.setAttribute('x',Math.max(0,vx).toFixed(1));vp.setAttribute('y',Math.max(0,vy).toFixed(1));
 vp.setAttribute('width',Math.min(MW,vw).toFixed(1));vp.setAttribute('height',Math.min(mh,vh).toFixed(1));}
mini.addEventListener('click',e=>{const r=mini.getBoundingClientRect();const cx=(e.clientX-r.left)/mscale,cy=(e.clientY-r.top)/mscale;
 stage.scrollLeft=cx*scale-stage.clientWidth/2;stage.scrollTop=cy*scale-stage.clientHeight/2;});
// keyboard
document.addEventListener('keydown',e=>{
 if(e.target.tagName==='INPUT')return;
 if(e.key==='/'){e.preventDefault();document.getElementById('search').focus();return;}
 if(e.key==='Escape'){deselect();document.getElementById('panel').classList.remove('open');return;}
 if(!cur)return;const n=N[cur];
 if(e.key==='ArrowRight'&&(n.next||[]).length){e.preventDefault();select(n.next[0]);}
 else if(e.key==='ArrowLeft'&&(n.prev||[]).length){e.preventDefault();select(n.prev[0]);}});
// pan
let pan=null;
stage.addEventListener('mousedown',e=>{if(e.target.closest('.box'))return;pan={x:e.clientX,y:e.clientY,l:stage.scrollLeft,t:stage.scrollTop};stage.classList.add('grabbing');});
window.addEventListener('mousemove',e=>{if(!pan)return;stage.scrollLeft=pan.l-(e.clientX-pan.x);stage.scrollTop=pan.t-(e.clientY-pan.y);});
window.addEventListener('mouseup',()=>{pan=null;stage.classList.remove('grabbing');});
// deep-link
window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(id&&N[id]&&id!==cur)select(id,false);});
zfit();
const initId=location.hash.slice(1);if(initId&&N[initId])select(initId,false);
window.addEventListener('resize',()=>{syncHead();updateMini();});
</script></body></html>
